services:
  - type: web
    name: ban-hoc-backend-v2
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python start_render.py
    healthCheckPath: /api/v1/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_PERSONA_DATA
        value: "false"
      - key: SEED_PERSONA_RESET_NON_ADMIN
        value: "false"
      - key: SEED_VISUAL_SUPPORT_DEMO
        value: "false"
      - key: GEMINI_MODEL_NAME
        value: gemini-2.5-flash
      - key: GEMINI_API_KEYS
        sync: false
      - key: DATABASE_URL
        value: sqlite:///instance/dev.db
      - key: SYNC_DEPLOY_SNAPSHOT
        value: "false"
      - key: DEPLOY_SNAPSHOT_SOURCE_URL
        value: sqlite:///instance/dev.db
      - key: JSON_SNAPSHOT_RESTORE
        value: "true"
      - key: JSON_SNAPSHOT_PATH
        value: data/demo_snapshot.json
      - key: JSON_SNAPSHOT_REQUIRED
        value: "true"
      - key: PERSIST_JSON_TO_GITHUB
        value: "true"
      - key: GITHUB_REPO
        value: smartlearnerqtr-max/webapp
      - key: GITHUB_BRANCH
        value: main
      - key: GITHUB_SNAPSHOT_PATH
        value: backend/data/demo_snapshot.json
      - key: GITHUB_TOKEN
        sync: false
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: ban-hoc-frontend-v2
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: ban-hoc-frontend-v2
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ban-hoc-backend-v2
          envVarKey: RENDER_EXTERNAL_URL
