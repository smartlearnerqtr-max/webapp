<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medium Lesson Media Lab</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f4ee;
      --panel: #ffffff;
      --line: #d9d2c0;
      --ink: #17324d;
      --muted: #5f7286;
      --accent: #2f79c4;
      --accent-soft: #e8f2ff;
      --accent-green: #1c8f7a;
      --gold: #e4a33e;
      --warn: #d65b52;
      --shadow: 0 14px 34px rgba(23, 50, 77, 0.12);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; overflow-x: hidden; }
    body {
      margin: 0;
      background: radial-gradient(circle at top, #fffdf8, var(--bg));
      color: var(--ink);
    }
    @keyframes pulseHalo {
      0%, 100% { transform: scale(1); opacity: 0.72; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes floatGlow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .shell { padding: 16px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 18px;
      display: grid;
      gap: 14px;
    }
    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .eyebrow {
      margin: 0 0 4px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 22px; line-height: 1.2; }
    .sub { color: var(--muted); font-size: 14px; line-height: 1.5; }
    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
      font-size: 13px;
    }
    .grid, .board, .pool, .slots, .tool-row, .coin-row, .jar-row, .bag-row, .bag-slots {
      display: grid;
      gap: 12px;
    }
    .pool, .bag-row { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
    .slots, .jar-row, .bag-slots { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
    .choice, .slot, .tool, .coin-button, .bag-button {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      padding: 12px;
      font: inherit;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .choice:hover, .slot:hover, .tool:hover, .coin-button:hover, .bag-button:hover { transform: translateY(-1px); }
    .choice-active, .slot-active, .tool-active {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(47, 121, 196, 0.12);
    }
    .slot {
      min-height: 96px;
      display: grid;
      align-content: start;
      gap: 6px;
      text-align: left;
      background: linear-gradient(180deg, #fff, #fbfaf6);
    }
    .slot-label { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; }
    .slot-value { font-weight: 700; color: var(--ink); }
    .hint { color: var(--muted); font-size: 13px; line-height: 1.45; }
    .success, .warn {
      padding: 12px 14px;
      border-radius: 16px;
      font-weight: 700;
    }
    .success { background: #edf8f4; color: #176a58; }
    .warn { background: #fff5f1; color: var(--warn); }
    .scene {
      min-height: 280px;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--line);
      position: relative;
      background: linear-gradient(180deg, #f2fbff, #fff);
    }
    .scene-fill {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0.98;
    }
    .scene-overlay {
      position: relative;
      z-index: 1;
      min-height: 280px;
      display: grid;
      align-content: end;
      gap: 8px;
      padding: 18px;
      background: linear-gradient(180deg, rgba(12, 32, 52, 0.08), rgba(12, 32, 52, 0.62));
      color: #fff;
    }
    .center-panel {
      display: grid;
      place-items: center;
      min-height: 220px;
      text-align: center;
      padding: 16px;
    }
    .emoji { font-size: 70px; line-height: 1; display: block; }
    .globe {
      width: 240px;
      height: 240px;
      margin: 0 auto;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #70d7ff, #13619a);
      border: 6px solid #d7eefb;
      position: relative;
      overflow: hidden;
    }
    .continent {
      position: absolute;
      border-radius: 999px;
      background: #53b36e;
      border: 2px solid rgba(255,255,255,0.45);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .continent-active {
      transform: scale(1.05);
      box-shadow: 0 0 0 6px rgba(255,255,255,0.22);
      background: #ffd86f;
    }
    .route-board {
      min-height: 280px;
      border-radius: 24px;
      border: 1px solid var(--line);
      background:
        radial-gradient(circle at 20% 26%, rgba(83,179,110,0.18) 0 12%, transparent 13%),
        radial-gradient(circle at 75% 58%, rgba(83,179,110,0.18) 0 14%, transparent 15%),
        linear-gradient(180deg, #eef8ff, #fffaf0);
      position: relative;
      overflow: hidden;
      padding: 18px;
    }
    .route-dot {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #2f79c4;
      border: 4px solid #fff;
      box-shadow: 0 4px 12px rgba(47,121,196,0.22);
    }
    .route-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }
    .route-line {
      stroke: #f3a63f;
      stroke-width: 6;
      stroke-linecap: round;
      fill: none;
    }
    .jar {
      min-height: 190px;
      border-radius: 24px 24px 20px 20px;
      border: 2px solid var(--line);
      background: linear-gradient(180deg, #fbfdff, #eef5ff);
      padding: 14px;
      display: grid;
      gap: 10px;
      align-content: start;
    }
    .jar-mouth {
      height: 18px;
      border-radius: 999px;
      background: #d5e0ef;
    }
    .coin {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(180deg, #ffd873, #efb642);
      border: 2px solid #d18e1f;
      display: inline-grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
      color: #7c5310;
      margin-right: 6px;
      margin-bottom: 6px;
    }
    .coin-bank {
      min-height: 54px;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
    }
    .message-card {
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px;
      background: linear-gradient(180deg, #fff, #f8fbff);
      display: grid;
      gap: 10px;
    }
    .message-bubble {
      border-radius: 18px;
      padding: 14px 16px;
      background: #fff4e2;
      color: #8a5616;
      font-weight: 700;
    }
    .bubble-stage, .drum-stage {
      min-height: 280px;
      border-radius: 22px;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #f2fbff, #fff9ef);
    }
    .bubble {
      position: absolute;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 5px solid #38b7ff;
      background: rgba(255,255,255,0.64);
      display: grid;
      place-items: center;
      font-size: 28px;
      cursor: pointer;
      user-select: none;
    }
    .note {
      position: absolute;
      width: 72px;
      height: 72px;
      left: calc(50% - 36px);
      top: 20px;
      display: grid;
      place-items: center;
      font-size: 42px;
      transition: top 0.18s linear;
    }
    .drum {
      position: absolute;
      left: calc(50% - 72px);
      bottom: 18px;
      width: 144px;
      height: 88px;
      border-radius: 999px 999px 24px 24px;
      border: 4px solid #6a3b10;
      background: linear-gradient(180deg, #ffd086, #d7812f);
      cursor: pointer;
      font-size: 34px;
    }
    .orange-svg { width: min(280px, 100%); display: block; margin: 0 auto; }
    .petal { transition: fill 0.2s ease; }
    .palette { display: flex; flex-wrap: wrap; gap: 10px; }
    .palette button {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid #fff;
      box-shadow: 0 0 0 1px var(--line);
      cursor: pointer;
    }
    .pottery-shell {
      min-height: 280px;
      border-radius: 24px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #f5faff, #fff5ea);
      display: grid;
      gap: 16px;
      place-items: center;
      padding: 20px;
    }
    .pottery-piece {
      width: 150px;
      height: 190px;
      background: linear-gradient(180deg, #d98f54, #a35d2a);
      clip-path: path("M75 8 C115 8 121 32 114 58 C106 90 126 122 126 164 C126 182 105 192 75 192 C45 192 24 182 24 164 C24 122 44 90 36 58 C29 32 35 8 75 8 Z");
      transition: transform 0.2s ease;
      box-shadow: 0 18px 30px rgba(121, 67, 28, 0.2);
    }
    .pottery-piece-wide { transform: scaleX(1.08); }
    .pottery-piece-tall { transform: scaleY(1.08); }
    .bag-shell {
      min-height: 240px;
      border-radius: 24px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #eef8ff, #fffaf0);
      padding: 18px;
      display: grid;
      gap: 14px;
    }
    .bag-slot-card {
      border: 1px dashed #aac3dc;
      border-radius: 18px;
      min-height: 84px;
      padding: 10px;
      display: grid;
      gap: 6px;
      align-content: start;
      background: rgba(255,255,255,0.72);
    }
    .bag-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #edf8f4;
      color: #176a58;
      font-weight: 700;
      font-size: 13px;
    }
    @media (max-width: 720px) {
      .hero { display: grid; }
      .route-board, .scene, .bubble-stage, .drum-stage { min-height: 240px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div id="app" class="card"></div>
  </div>
  <script>
    const app = document.getElementById('app');
    const params = new URLSearchParams(window.location.search);
    const activity = params.get('activity') || 'ngu-van-mindmap';

    function reportHeight() {
      const root = document.documentElement;
      const body = document.body;
      const height = Math.ceil(Math.max(
        root ? root.scrollHeight : 0,
        root ? root.offsetHeight : 0,
        body ? body.scrollHeight : 0,
        body ? body.offsetHeight : 0
      ));
      try {
        window.parent.postMessage({ type: 'lesson-media-height', height }, '*');
      } catch {}
    }

    function setHTML(html) {
      app.innerHTML = html;
      requestAnimationFrame(reportHeight);
      window.setTimeout(reportHeight, 140);
    }

    function shell(title, subtitle, body, badge = 'Mức trung bình') {
      return `
        <div class="hero">
          <div>
            <p class="eyebrow">Bám theo bosung.md</p>
            <h1>${title}</h1>
            <p class="sub">${subtitle}</p>
          </div>
          <span class="pill">${badge}</span>
        </div>
        ${body}
      `;
    }

    function renderSceneCard(options) {
      const body = options.photo
        ? `<div class="scene"><div class="scene-fill" style="background-image:url('${options.photo}')"></div><div class="scene-overlay"><h2>${options.title}</h2><p>${options.copy}</p></div></div>`
        : `<div class="scene"><div class="center-panel"><div><span class="emoji">${options.emoji}</span><h2>${options.title}</h2><p class="sub">${options.copy}</p></div></div></div>`;
      setHTML(shell(options.heading || options.title, options.subtitle, body, options.badge || 'Thẻ trực quan'));
    }

    function mountPickerBoard(options) {
      let selected = null;
      const state = {};
      const cards = [...options.cards];

      function redraw() {
        const pool = cards
          .filter((card) => !Object.values(state).includes(card.id))
          .map((card) => `
            <button class="choice ${selected === card.id ? 'choice-active' : ''}" data-card="${card.id}">
              <strong>${card.label}</strong>
              <div class="hint">${card.hint || ''}</div>
            </button>
          `)
          .join('');

        const slots = options.slots
          .map((slot) => {
            const card = cards.find((item) => item.id === state[slot.id]);
            return `
              <button class="slot ${selected && !card ? 'slot-active' : ''}" data-slot="${slot.id}">
                <span class="slot-label">${slot.label}</span>
                ${card ? `<span class="slot-value">${card.label}</span><span class="hint">Bấm để bỏ ra.</span>` : `<span class="hint">${slot.placeholder}</span>`}
              </button>
            `;
          })
          .join('');

        const correctCount = options.slots.filter((slot) => state[slot.id] === slot.answer).length;
        const done = options.slots.every((slot) => state[slot.id]);

        setHTML(
          shell(
            options.title,
            options.subtitle,
            `
              <div class="board">
                <div class="pool">${pool}</div>
                <div class="slots">${slots}</div>
                <p class="${done && correctCount === options.slots.length ? 'success' : 'hint'}">
                  ${done && correctCount === options.slots.length ? options.success : `Đã xếp đúng ${correctCount}/${options.slots.length}. Chạm thẻ rồi chạm ô trống.`}
                </p>
              </div>
            `,
            options.badge || 'Kéo thả mô phỏng'
          )
        );

        app.querySelectorAll('[data-card]').forEach((node) => {
          node.addEventListener('click', () => {
            selected = node.getAttribute('data-card');
            redraw();
          });
        });

        app.querySelectorAll('[data-slot]').forEach((node) => {
          node.addEventListener('click', () => {
            const slotId = node.getAttribute('data-slot');
            if (state[slotId]) {
              delete state[slotId];
            } else if (selected) {
              state[slotId] = selected;
              selected = null;
            }
            redraw();
          });
        });
      }

      redraw();
    }

    function renderMindmap() {
      mountPickerBoard({
        title: 'Sơ đồ tư duy điền khuyết',
        subtitle: 'Kéo thả ảnh hoặc từ khóa sự việc vào đúng ô trống theo thứ tự của cốt truyện.',
        success: 'Sơ đồ đã hoàn chỉnh. Em vừa nối được nhân vật, diễn biến và bài học của truyện.',
        slots: [
          { id: 'nhan-vat', label: 'Nhân vật', placeholder: 'Ô này chờ từ khóa.', answer: 'ech-rua' },
          { id: 'bat-dau', label: 'Mở đầu', placeholder: 'Ô này chờ từ khóa.', answer: 'ech-day-gieng' },
          { id: 'dien-bien', label: 'Diễn biến', placeholder: 'Ô này chờ từ khóa.', answer: 'ech-len-bo' },
          { id: 'bai-hoc', label: 'Bài học', placeholder: 'Ô này chờ từ khóa.', answer: 'khong-chu-quan' }
        ],
        cards: [
          { id: 'ech-rua', label: 'Ếch và các con vật quanh giếng', hint: 'Nhóm nhân vật chính' },
          { id: 'ech-day-gieng', label: 'Ếch sống lâu ở đáy giếng', hint: 'Sự việc mở đầu' },
          { id: 'ech-len-bo', label: 'Ếch lên bờ nên gặp nguy hiểm', hint: 'Sự việc tiếp theo' },
          { id: 'khong-chu-quan', label: 'Không nên chủ quan', hint: 'Bài học rút ra' }
        ]
      });
    }

    function renderShapeSort() {
      let selected = null;
      const state = {};
      const items = [
        { id: 'leu', label: 'Cái lều', hint: 'Mái nhọn, đáy rộng.', kind: 'pyramid', accent: '#f7b348', answer: 'chop' },
        { id: 'mai-nha', label: 'Mái nhà', hint: 'Có đỉnh nhọn như hình chóp.', kind: 'roof', accent: '#ef8550', answer: 'chop' },
        { id: 'tu-lanh', label: 'Tủ lạnh', hint: 'Thân dài, mặt bên phẳng.', kind: 'prism', accent: '#5ea4ff', answer: 'lang-tru' },
        { id: 'hop-sua', label: 'Hộp sữa', hint: 'Dáng hộp đứng quen thuộc.', kind: 'prism', accent: '#6fd0c4', answer: 'lang-tru' }
      ];
      const groups = [
        { id: 'chop', label: 'Nhóm hình chóp', copy: 'Đỉnh nhọn, các mặt gặp nhau ở phía trên.' },
        { id: 'lang-tru', label: 'Nhóm lăng trụ', copy: 'Thân thẳng, nhiều mặt phẳng song song.' }
      ];

      function renderShapeObject(item, compact) {
        if (item.kind === 'prism') {
          return `
            <div style="position:relative;width:${compact ? 74 : 94}px;height:${compact ? 74 : 94}px;display:grid;place-items:center;">
              <div style="position:absolute;left:16px;top:22px;width:${compact ? 42 : 54}px;height:${compact ? 34 : 42}px;border-radius:14px;background:linear-gradient(135deg,${item.accent},#1d4f92);box-shadow:0 16px 24px rgba(29,79,146,0.22);"></div>
              <div style="position:absolute;left:24px;top:14px;width:${compact ? 32 : 42}px;height:${compact ? 12 : 14}px;transform:skew(-34deg);border-radius:10px 10px 0 0;background:rgba(255,255,255,0.8);"></div>
              <div style="position:absolute;right:10px;top:24px;width:${compact ? 14 : 16}px;height:${compact ? 36 : 44}px;transform:skewY(-34deg);border-radius:0 12px 12px 0;background:#193f77;"></div>
            </div>
          `;
        }
        return `
          <div style="position:relative;width:${compact ? 74 : 94}px;height:${compact ? 74 : 94}px;display:grid;place-items:center;">
            <div style="position:absolute;left:${compact ? 16 : 20}px;bottom:${compact ? 10 : 12}px;width:0;height:0;border-left:${compact ? 20 : 26}px solid transparent;border-right:${compact ? 20 : 26}px solid transparent;border-bottom:${compact ? 44 : 54}px solid ${item.accent};filter:drop-shadow(0 14px 18px rgba(155,88,18,0.24));"></div>
            <div style="position:absolute;left:${compact ? 20 : 26}px;bottom:${compact ? 6 : 8}px;width:${compact ? 34 : 42}px;height:8px;border-radius:999px;background:rgba(27,50,77,0.16);"></div>
          </div>
        `;
      }

      function redraw() {
        const assignedCount = Object.keys(state).length;
        const correctCount = items.filter((item) => state[item.id] === item.answer).length;
        const pool = items
          .filter((item) => !state[item.id])
          .map((item) => `
            <button class="choice ${selected === item.id ? 'choice-active' : ''}" data-item="${item.id}" style="padding:14px;border-radius:22px;background:linear-gradient(180deg,#ffffff,#eef5ff);box-shadow:0 18px 28px rgba(33,63,103,0.1);">
              <div style="display:grid;justify-items:center;gap:8px;">
                ${renderShapeObject(item, false)}
                <strong>${item.label}</strong>
                <div class="hint">${item.hint}</div>
              </div>
            </button>
          `)
          .join('');

        const zones = groups.map((group) => {
          const assignedItems = items.filter((item) => state[item.id] === group.id);
          return `
            <button class="slot ${selected ? 'slot-active' : ''}" data-group="${group.id}" style="min-height:220px;border-radius:24px;padding:16px;background:linear-gradient(180deg,#ffffff,#f8fbff);box-shadow:0 18px 30px rgba(33,63,103,0.08);">
              <span class="slot-label">${group.label}</span>
              <strong style="font-size:18px;">${group.copy}</strong>
              <div style="min-height:86px;border-radius:20px;background:linear-gradient(180deg,rgba(230,241,255,0.96),rgba(255,248,240,0.96));border:1px dashed rgba(87,128,176,0.34);display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;flex-wrap:wrap;">
                ${assignedItems.length ? assignedItems.map((item) => `
                  <span data-remove="${item.id}" style="display:inline-grid;justify-items:center;gap:4px;padding:10px 12px;border-radius:18px;background:#fff;box-shadow:0 12px 22px rgba(23,50,77,0.1);">
                    ${renderShapeObject(item, true)}
                    <strong style="font-size:12px;">${item.label}</strong>
                  </span>
                `).join('') : '<span class="hint">Chạm vào vật ở khay trên rồi đặt vào nhóm này.</span>'}
              </div>
            </button>
          `;
        }).join('');

        setHTML(shell('Phân loại hình khối 3D', 'Quan sát mô hình nổi, rồi đưa từng vật vào đúng sân khấu hình chóp hoặc lăng trụ.', `
          <div class="grid">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:22px;background:linear-gradient(135deg,#17324d,#285f9a);color:#fff;box-shadow:0 20px 32px rgba(23,50,77,0.18);">
              <div>
                <div style="font-size:12px;letter-spacing:0.08em;text-transform:uppercase;opacity:0.84;">Khởi động 3D</div>
                <strong style="font-size:18px;">Nhìn vật thật, đoán hình khối</strong>
              </div>
              <div style="display:flex;gap:10px;align-items:center;">
                <span class="pill" style="background:rgba(255,255,255,0.14);color:#fff;">Đã xếp ${correctCount}/4</span>

    function renderDrumStage() {
      let noteTop = 20;
      let status = 'Bấm bắt đầu rồi chạm vào trống khi nốt nhạc xuống gần đích.';
      let active = false;
      let timer = null;

      function stopTimer() {
        if (timer) {
          window.clearInterval(timer);
          timer = null;
        }
      }

      function startTimer() {
        stopTimer();
        active = true;
        noteTop = 20;
        status = 'Nốt nhạc đang đi xuống. Canh đúng lúc để chạm trống.';
        timer = window.setInterval(() => {
          noteTop += 18;
          if (noteTop >= 180) {
            stopTimer();
            active = false;
            status = 'Nốt nhạc đã tới vạch đích. Em hãy chạm trống hoặc bấm bắt đầu lại.';
          }
          redraw();
        }, 180);
      }

      function hitDrum() {
        if (noteTop >= 154 && noteTop <= 194) {
          stopTimer();
          active = false;
          status = 'Đúng nhịp rồi. Em đã gõ trống ảo rất chuẩn.';
          redraw();
          return;
        }
        status = 'Nhịp này chưa khớp. Em bấm bắt đầu lại và canh trống kỹ hơn nhé.';
        redraw();
      }

      function redraw() {
        setHTML(shell('Trống ảo theo nhịp', 'Mở sân khấu mini, canh đúng nhịp và chạm vào mặt trống khi nốt rơi xuống vạch sáng.', `

                <span style="width:18px;height:18px;border-radius:50%;background:#ffd86f;box-shadow:0 0 18px rgba(255,216,111,0.7);animation:pulseHalo 1.6s ease-in-out infinite;"></span>
              </div>
              <div style="position:absolute;left:26px;right:26px;bottom:118px;height:8px;border-radius:999px;background:linear-gradient(90deg,#ffe698,#ff9d5c,#ffe698);box-shadow:0 0 24px rgba(255,189,102,0.46);"></div>
              <div class="note" style="top:${noteTop}px;animation:${active ? 'floatGlow 1.6s ease-in-out infinite' : 'none'};">🎵</div>
              <button class="drum" id="hit-drum" style="box-shadow:0 22px 36px rgba(82,34,4,0.3);">🥁</button>
            </div>
            <div class="tool-row">
              <button class="tool ${active ? 'tool-active' : ''}" id="start-drum">${active ? 'Đang chạy' : 'Bắt đầu nhịp mới'}</button>
            </div>
            <p class="${status.includes('Đúng nhịp') ? 'success' : status.includes('chưa khớp') ? 'warn' : 'hint'}">${status}</p>
          </div>
        `, 'Cảm thụ âm nhạc'));
        app.querySelector('#start-drum').addEventListener('click', () => {

        app.querySelector('#hit-drum').addEventListener('click', hitDrum);

            <div class="tool-row">
              <button class="tool ${shape === 'wide' ? 'tool-active' : ''}" id="wide">Mở thân bình</button>
              <button class="tool ${shape === 'tall' ? 'tool-active' : ''}" id="tall">Kéo cao cổ bình</button>
              <button class="tool ${shape === '' ? 'tool-active' : ''}" id="reset">Đưa về dáng gốc</button>
            </div>
            <p class="${shape ? 'success' : 'hint'}">${shape ? 'Chiếc bình đã đổi dáng. Em vừa hoàn thành một bước tạo hình gốm ảo.' : 'Em hãy chọn một thao tác để nắn khối đất sét.'}</p>
          </div>
        `, 'Sáng tạo mỹ thuật'));
        app.querySelector('#wide').addEventListener('click', () => { shape = 'wide'; redraw(); });
        app.querySelector('#tall').addEventListener('click', () => { shape = 'tall'; redraw(); });
        app.querySelector('#reset').addEventListener('click', () => { shape = ''; redraw(); });
      }
      redraw();
    }

    function renderBagPack() {
      let selected = null;
      const state = {};
      const books = [
        { id: 'sach-toan', label: 'Sách Toán', hint: 'Mang theo cho tiết Toán.' },
        { id: 'sach-van', label: 'Sách Văn', hint: 'Mang theo cho tiết Văn.' },
        { id: 'vo-ghi', label: 'Vở ghi', hint: 'Dùng chung để ghi bài.' }
      ];
      const slots = [
        { id: 'mon-toan', label: 'Tiết Toán', answer: 'sach-toan', placeholder: 'Bỏ sách đúng vào đây.' },
        { id: 'mon-van', label: 'Tiết Văn', answer: 'sach-van', placeholder: 'Bỏ sách đúng vào đây.' },
        { id: 'mon-chung', label: 'Đồ dùng chung', answer: 'vo-ghi', placeholder: 'Đặt vở ghi vào đây.' }
      ];

      function redraw() {
        const pool = books
          .filter((book) => !Object.values(state).includes(book.id))
          .map((book) => `<button class="bag-button ${selected === book.id ? 'choice-active' : ''}" data-book="${book.id}"><strong>${book.label}</strong><div class="hint">${book.hint}</div></button>`)
          .join('');
        const bagSlots = slots
          .map((slot) => {
            const book = books.find((item) => item.id === state[slot.id]);
            return `
              <button class="bag-slot-card ${selected && !book ? 'slot-active' : ''}" data-slot="${slot.id}">
                <span class="slot-label">${slot.label}</span>
                ${book ? `<span class="bag-chip">${book.label}</span><span class="hint">Bấm để bỏ ra.</span>` : `<span class="hint">${slot.placeholder}</span>`}
              </button>
            `;
          })
          .join('');
        const correctCount = slots.filter((slot) => state[slot.id] === slot.answer).length;
        const done = slots.every((slot) => state[slot.id]);
        setHTML(shell('Soạn cặp sách', 'Chạm sách rồi chạm ô trong balo ảo để soạn đúng theo thời khóa biểu.', `
          <div class="bag-shell">
            <div class="bag-row">${pool}</div>
            <div class="bag-slots">${bagSlots}</div>
            <p class="${done && correctCount === slots.length ? 'success' : 'hint'}">${done && correctCount === slots.length ? 'Balo đã được soạn đúng đủ 3 món cần mang.' : `Đã xếp đúng ${correctCount}/${slots.length} món.`}</p>
          </div>
        `, 'Tự phục vụ'));
        app.querySelectorAll('[data-book]').forEach((node) => {
          node.addEventListener('click', () => {
            selected = node.getAttribute('data-book');
            redraw();
          });
        });
        app.querySelectorAll('[data-slot]').forEach((node) => {
          node.addEventListener('click', () => {
            const slotId = node.getAttribute('data-slot');
            if (state[slotId]) {
              delete state[slotId];
            } else if (selected) {
              state[slotId] = selected;
              selected = null;
            }
            redraw();
          });
        });
      }

      redraw();
    }

    function renderSavings() {
      let coinsLeft = 20;
      let piggy = 0;
      let candy = 0;
      function redraw() {
        setHTML(shell('Chi tiêu cá nhân ảo', 'Em có 20 xu. Hãy chia một phần vào heo đất và một phần vào mua kẹo.', `
          <div class="grid">
            <div class="jar-row">
              <div class="jar">
                <div class="jar-mouth"></div>
                <strong>Heo đất tiết kiệm</strong>
                <div class="coin-bank">${Array.from({ length: piggy }, () => '<span class="coin">1</span>').join('') || '<span class="hint">Chưa có xu nào.</span>'}</div>
                <button class="tool" id="save-coin" ${coinsLeft <= 0 ? 'disabled' : ''}>+ Bỏ vào heo đất</button>
              </div>
              <div class="jar">
                <div class="jar-mouth"></div>
                <strong>Mua kẹo</strong>
                <div class="coin-bank">${Array.from({ length: candy }, () => '<span class="coin">1</span>').join('') || '<span class="hint">Chưa dùng xu nào.</span>'}</div>
                <button class="tool" id="buy-candy" ${coinsLeft <= 0 ? 'disabled' : ''}>+ Dùng để mua kẹo</button>
              </div>
            </div>
            <p class="${coinsLeft === 0 && piggy > 0 && candy > 0 ? 'success' : 'hint'}">${coinsLeft === 0 ? `Đã chia xong 20 xu: tiết kiệm ${piggy} xu, mua kẹo ${candy} xu.` : `Còn lại ${coinsLeft} xu để phân chia.`}</p>
          </div>
        `, 'Quản lý tài chính'));
        const saveButton = app.querySelector('#save-coin');
        const buyButton = app.querySelector('#buy-candy');
        if (saveButton) {
          saveButton.addEventListener('click', () => {
            if (coinsLeft <= 0) return;
            coinsLeft -= 1;
            piggy += 1;
            redraw();
          });
        }
        if (buyButton) {
          buyButton.addEventListener('click', () => {
            if (coinsLeft <= 0) return;
            coinsLeft -= 1;
            candy += 1;
            redraw();
          });
        }
      }
      redraw();
    }

    const renderers = {
      'ngu-van-mindmap': renderMindmap,
      'toan-shape-sort': renderShapeSort,
      'toan-coins': renderCoinTask,
      'khtn-magnet': renderMagnet,
      'lsdl-globe': renderGlobe,
      'lsdl-route': renderRoute,
      'congnghe-grow': renderGrowProcess,
      'gdcd-calm': renderBreathing,
      'tinhoc-safe': renderSafetyChat,
      'gdtc-ar': renderBubbleStage,
      'amnhac-drum': renderDrumStage,
      'mythuat-fill': renderOrangeFill,
      'mythuat-pottery': renderPottery,
      'hdtn-bag': renderBagPack,
      'hdtn-budget': renderSavings,
      'tieng-anh-festival': () => renderSceneCard({
        heading: 'Flashcard lật mở',
        title: 'Festival',
        subtitle: 'Chạm vào thẻ để em nhớ từ “Festival” gắn với lễ hội đông vui.',
        photo: '../nhe/photos/festival-viet-nam.jpg',
        copy: 'Lễ hội có cờ, sân khấu và rất nhiều người cùng tham gia.'
      })
    };

    (renderers[activity] || renderMindmap)();
    window.addEventListener('resize', reportHeight);
  </script>
</body>
</html>
