<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesson Media Lab</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f5ef;
      --panel: #ffffff;
      --line: #d9d2c0;
      --ink: #17324d;
      --muted: #5f7286;
      --accent: #1c8f7a;
      --accent-soft: #daf4ed;
      --gold: #e4a33e;
      --warn: #d65b52;
      --shadow: 0 14px 34px rgba(23, 50, 77, 0.12);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; overflow-x: hidden; }
    body {
      margin: 0;
      background: radial-gradient(circle at top, #fffdf8, var(--bg));
      color: var(--ink);
    }
    .shell { min-height: auto; padding: 16px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 18px;
      display: grid;
      gap: 14px;
    }
    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .eyebrow {
      margin: 0 0 4px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    h1, h2, h3, p { margin: 0; }
    h1, h2 { font-size: 22px; line-height: 1.2; }
    .sub { color: var(--muted); font-size: 14px; line-height: 1.5; }
    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
      font-size: 13px;
    }
    .board, .pool, .slots, .grid, .stage { display: grid; gap: 12px; }
    .pool { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
    .slots { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
    .choice, .slot, .tool, .small-btn, .photo-btn {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      padding: 12px;
      font: inherit;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .choice:hover, .slot:hover, .tool:hover, .small-btn:hover, .photo-btn:hover { transform: translateY(-1px); }
    .choice-active, .slot-active, .tool-active {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(28, 143, 122, 0.12);
    }
    .slot {
      min-height: 96px;
      display: grid;
      align-content: start;
      gap: 6px;
      text-align: left;
      background: linear-gradient(180deg, #fff, #fbfaf6);
    }
    .slot-label { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; }
    .slot-value { font-weight: 700; color: var(--ink); }
    .hint { color: var(--muted); font-size: 13px; line-height: 1.45; }
    .success {
      padding: 12px 14px;
      border-radius: 16px;
      background: #edf8f4;
      color: #176a58;
      font-weight: 700;
    }
    .warn {
      padding: 12px 14px;
      border-radius: 16px;
      background: #fff5f1;
      color: var(--warn);
      font-weight: 700;
    }
    .scene {
      min-height: 300px;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--line);
      position: relative;
      background: linear-gradient(180deg, #f2fbff, #fff);
    }
    .scene-fill {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0.98;
    }
    .scene-overlay {
      position: relative;
      z-index: 1;
      min-height: 300px;
      display: grid;
      align-content: end;
      gap: 8px;
      padding: 18px;
      background: linear-gradient(180deg, rgba(12, 32, 52, 0.06), rgba(12, 32, 52, 0.62));
      color: #fff;
    }
    .center-panel {
      display: grid;
      place-items: center;
      min-height: 220px;
      text-align: center;
      padding: 16px;
    }
    .emoji {
      font-size: 70px;
      line-height: 1;
      display: block;
    }
    .face {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: #fff8d9;
      border: 6px solid #17324d;
      position: relative;
      margin: 0 auto;
    }
    .eye, .nose, .mouth {
      position: absolute;
      background: #17324d;
      border-radius: 999px;
    }
    .eye { width: 26px; height: 26px; top: 62px; }
    .eye.left { left: 48px; }
    .eye.right { right: 48px; }
    .nose { width: 18px; height: 38px; top: 92px; left: calc(50% - 9px); }
    .mouth { width: 84px; height: 18px; bottom: 52px; left: calc(50% - 42px); }
    .piece-row, .orbit-row, .tool-row, .palette, .jar-row, .slide-row, .sticker-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .piece {
      min-width: 88px;
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: 16px;
      background: #fff;
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 700;
    }
    .piece.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .orbit {
      width: 250px;
      height: 250px;
      border-radius: 50%;
      border: 2px dashed #91b6da;
      margin: 0 auto;
      position: relative;
      background: radial-gradient(circle, rgba(255,255,255,0.96), rgba(233,245,255,0.96));
    }
    .nucleus {
      position: absolute;
      top: calc(50% - 42px);
      left: calc(50% - 42px);
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: #ffcc66;
      border: 3px solid #e4a33e;
      display: grid;
      place-items: center;
      font-weight: 700;
    }
    .electron {
      position: absolute;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #39a1ff;
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(57, 161, 255, 0.28);
    }
    .globe {
      width: 240px;
      height: 240px;
      margin: 0 auto;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #70d7ff, #13619a);
      border: 6px solid #d7eefb;
      position: relative;
      overflow: hidden;
    }
    .continent {
      position: absolute;
      border-radius: 999px;
      background: #53b36e;
      border: 2px solid rgba(255,255,255,0.45);
      cursor: pointer;
    }
    .coin {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: linear-gradient(180deg, #ffd873, #efb642);
      border: 2px solid #d18e1f;
      display: inline-grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
      color: #7c5310;
    }
    .jar {
      flex: 1 1 180px;
      min-height: 180px;
      border-radius: 24px 24px 20px 20px;
      border: 2px solid var(--line);
      background: linear-gradient(180deg, #fbfdff, #eef5ff);
      padding: 14px;
      display: grid;
      gap: 10px;
      align-content: start;
    }
    .jar-mouth {
      height: 18px;
      border-radius: 999px;
      background: #d5e0ef;
    }
    .excel-table {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
    }
    .excel-cell {
      min-height: 64px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 12px;
      background: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
    }
    .excel-cell:nth-child(3n) { border-right: 0; }
    .excel-cell.total { background: #eefaf5; cursor: pointer; }
    .slide-template, .sticker-target {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      padding: 12px;
    }
    .slide-canvas {
      min-height: 220px;
      border-radius: 20px;
      padding: 16px;
      display: grid;
      gap: 12px;
      background: linear-gradient(135deg, #f3f9ff, #fff6e8);
      border: 1px dashed var(--line);
    }
    .photo-box {
      min-height: 92px;
      border-radius: 16px;
      border: 1px dashed #b9c7d7;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      background: rgba(255,255,255,0.75);
    }
    .orange-svg { width: min(280px, 100%); display: block; margin: 0 auto; }
    .petal { transition: fill 0.2s ease; }
    .palette button {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid #fff;
      box-shadow: 0 0 0 1px var(--line);
      cursor: pointer;
    }
    .garden-canvas {
      min-height: 260px;
      border-radius: 22px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, #d7f0ff 0 44%, #b7e48a 44% 100%);
      border: 1px solid var(--line);
    }
    .flower {
      position: absolute;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffd86f 0 24%, #ef7ab2 26% 100%);
      opacity: 0.18;
    }
    .sticker {
      position: absolute;
      font-size: 38px;
      cursor: grab;
    }
    .flip-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }
    .flip-card {
      min-height: 280px;
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      background: #fff;
      cursor: pointer;
    }
    .flip-card img { width: 100%; height: 180px; object-fit: cover; display: block; }
    .flip-copy { padding: 14px; display: grid; gap: 8px; }
    .video-frame {
      min-height: 300px;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--line);
      background: #13243b;
    }
    .video-frame img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .video-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 14px;
      background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,0.65));
      color: #fff;
      z-index: 2;
      display: grid;
      gap: 8px;
    }
    .bar-track {
      height: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.22);
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #5ce0c3, #ffdf80);
      transition: width 0.4s linear;
    }
    .burst-stage, .rhythm-stage {
      min-height: 280px;
      border-radius: 22px;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #f2fbff, #fff9ef);
    }
    .bubble, .note {
      position: absolute;
      display: grid;
      place-items: center;
      cursor: pointer;
      user-select: none;
    }
    .bubble {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 5px solid #38b7ff;
      background: rgba(255,255,255,0.64);
      font-size: 28px;
    }
    .note {
      width: 72px;
      height: 72px;
      font-size: 42px;
      left: calc(50% - 36px);
      top: 20px;
      transition: top 0.18s linear;
    }
    .drum {
      position: absolute;
      left: calc(50% - 72px);
      bottom: 18px;
      width: 144px;
      height: 88px;
      border-radius: 999px 999px 24px 24px;
      border: 4px solid #6a3b10;
      background: linear-gradient(180deg, #ffd086, #d7812f);
      cursor: pointer;
      font-size: 34px;
    }
    input[type="text"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      font: inherit;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div id="app" class="card"></div>
  </div>
  <script>
    const app = document.getElementById('app');
    const params = new URLSearchParams(window.location.search);
    const activity = params.get('activity') || 'festival-card';

    function getPositiveIntParam(name, fallback) {
      const value = Number.parseInt(params.get(name) || '', 10);
      return Number.isFinite(value) && value > 0 ? value : fallback;
    }

    function getSafeLabelParam(name, fallback) {
      const value = (params.get(name) || '').trim();
      return value || fallback;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function dynamicLessonPromptPanel(defaultTitle, defaultPrompt) {
      const title = getSafeLabelParam('title', '');
      const prompt = getSafeLabelParam('prompt', '');
      if (!title && !prompt) return '';
      return `
        <div style="border:1px solid var(--line);border-radius:18px;padding:14px;background:#fffdf7;margin-bottom:12px;">
          <p class="slot-label">De AI</p>
          <h2 style="margin-top:6px;">${escapeHtml(title || defaultTitle)}</h2>
          <p class="hint" style="margin-top:8px;">${escapeHtml(prompt || defaultPrompt)}</p>
        </div>
      `;
    }

    function setHTML(html) {
      app.innerHTML = html;
      requestAnimationFrame(reportHeight);
      window.setTimeout(reportHeight, 120);
    }

    function reportHeight() {
      const root = document.documentElement;
      const body = document.body;
      const height = Math.ceil(Math.max(
        root ? root.scrollHeight : 0,
        root ? root.offsetHeight : 0,
        body ? body.scrollHeight : 0,
        body ? body.offsetHeight : 0,
      ));
      try {
        window.parent.postMessage({ type: 'lesson-media-height', height }, '*');
      } catch {}
    }

    function shell(title, subtitle, body, badge = 'Mức nhẹ') {
      return `
        <div class="hero" style="display: none;">
          <div>
            <h1>${title}</h1>
          </div>
        </div>
        ${dynamicLessonPromptPanel(title, subtitle)}
        ${body}
      `;
    }

    function renderSceneCard(options) {
      const bg = options.photo ? `style="background-image:url('${options.photo}')"` : '';
      const center = options.photo
        ? `<div class="scene"><div class="scene-fill" ${bg}></div><div class="scene-overlay"><h2>${options.title}</h2><p>${options.copy}</p></div></div>`
        : `<div class="scene"><div class="center-panel"><div><span class="emoji">${options.emoji}</span><h2>${options.title}</h2><p class="sub">${options.copy}</p></div></div></div>`;
      setHTML(shell(options.heading || options.title, options.subtitle, center, options.badge || 'Thẻ chọn'));
    }

    function mountPickerBoard(options) {
      let selected = null;
      const state = {};
      const cards = [...options.cards];
      function redraw() {
        const pool = cards.filter((card) => !Object.values(state).includes(card.id)).map((card) => `
          <button class="choice ${selected === card.id ? 'choice-active' : ''}" data-card="${card.id}">
            <strong>${card.label}</strong>
            <div class="hint">${card.hint || ''}</div>
          </button>
        `).join('');
        const slots = options.slots.map((slot) => {
          const card = cards.find((item) => item.id === state[slot.id]);
          return `
            <button class="slot ${selected && !card ? 'slot-active' : ''}" data-slot="${slot.id}">
              <span class="slot-label">${slot.label}</span>
              ${card ? `<span class="slot-value">${card.label}</span><span class="hint">Bấm để xóa.</span>` : `<span class="hint">${slot.placeholder}</span>`}
            </button>
          `;
        }).join('');
        const correctCount = options.slots.filter((slot) => state[slot.id] === slot.answer).length;
        const done = options.slots.every((slot) => state[slot.id]);
        setHTML(shell(options.title, options.subtitle, `
          <div class="board">
            <div class="pool">${pool}</div>
            <div class="slots">${slots}</div>
            <p class="${done && correctCount === options.slots.length ? 'success' : 'hint'}">${done && correctCount === options.slots.length ? options.success : `Đã xếp đúng ${correctCount}/${options.slots.length}. Chạm thẻ rồi chạm ô trống.`}</p>
          </div>
        `, options.badge || 'Kéo thả mô phỏng'));
        app.querySelectorAll('[data-card]').forEach((node) => {
          node.addEventListener('click', () => {
            selected = node.getAttribute('data-card');
            redraw();
          });
        });
        app.querySelectorAll('[data-slot]').forEach((node) => {
          node.addEventListener('click', () => {
            const slotId = node.getAttribute('data-slot');
            if (state[slotId]) {
              delete state[slotId];
            } else if (selected) {
              state[slotId] = selected;
              selected = null;
            }
            redraw();
          });
        });
      }
      redraw();
    }

    function renderMindmap() {
      mountPickerBoard({
        title: 'Sơ đồ tư duy điền khuyết',
        subtitle: 'Kéo thả ảnh hoặc từ khóa sự việc vào đúng nhánh trống của sơ đồ cốt truyện.',
        success: 'Sơ đồ đã hoàn chỉnh. Em vừa tóm tắt được bài bằng sơ đồ tư duy.',
        slots: [
          { id: 'nhan-vat', label: 'Nhân vật', placeholder: 'Ô này chờ từ khóa.', answer: 'rua-tho' },
          { id: 'bat-dau', label: 'Bắt đầu', placeholder: 'Ô này chờ từ khóa.', answer: 'tho-khoe' },
          { id: 'dien-bien', label: 'Diễn biến', placeholder: 'Ô này chờ từ khóa.', answer: 'rua-ve-dich' },
          { id: 'bai-hoc', label: 'Bài học', placeholder: 'Ô này chờ từ khóa.', answer: 'kien-tri' },
        ],
        cards: [
          { id: 'tho-khoe', label: 'Thỏ khoe chạy nhanh', hint: 'Sự việc mở đầu' },
          { id: 'rua-tho', label: 'Rùa và Thỏ', hint: 'Nhân vật chính' },
          { id: 'kien-tri', label: 'Kiên trì sẽ thành công', hint: 'Từ khóa bài học' },
          { id: 'rua-ve-dich', label: 'Rùa kiên trì về đích', hint: 'Sự việc quan trọng' },
        ],
      });
    }

    function renderPrism() {
      let mode = '';
      let angle = 18;
      function redraw() {
        setHTML(shell('Tương tác 3D hình khối', 'Xoay khối lăng trụ đứng và chạm vào nút đỉnh hoặc cạnh để App tự đếm số lượng.', `
          <div class="grid">
            <div class="scene" style="display:grid;place-items:center;background:linear-gradient(180deg,#eef8ff,#fff8eb);">
              <div style="width:200px;height:170px;position:relative;transform:rotateX(18deg) rotateY(${angle}deg);transform-style:preserve-3d;">
                <div style="position:absolute;inset:20px 44px;background:rgba(60,181,150,0.22);border:3px solid #1c8f7a;transform:translateZ(38px);"></div>
                <div style="position:absolute;inset:20px 44px;background:rgba(47,121,196,0.14);border:3px solid #2f79c4;transform:translateZ(-38px);"></div>
                <div style="position:absolute;top:20px;bottom:20px;left:44px;width:112px;border-left:3px solid #17324d;border-right:3px solid #17324d;"></div>
                <div style="position:absolute;top:20px;bottom:20px;left:44px;right:44px;border-top:3px solid #17324d;border-bottom:3px solid #17324d;"></div>
              </div>
            </div>
            <div class="tool-row">
              <button class="tool" id="xoay-trai">Xoay trái</button>
              <button class="tool" id="xoay-phai">Xoay phải</button>
              <button class="tool ${mode === 'dinh' ? 'tool-active' : ''}" id="dem-dinh">Chạm vào đỉnh</button>
              <button class="tool ${mode === 'canh' ? 'tool-active' : ''}" id="dem-canh">Chạm vào cạnh</button>
            </div>
            <p class="${mode ? 'success' : 'hint'}">${mode === 'dinh' ? 'Khối lăng trụ này có 6 đỉnh. App đã đếm giúp em.' : mode === 'canh' ? 'Khối lăng trụ này có 9 cạnh. App đã đếm giúp em.' : 'Em hãy xoay khối rồi bấm vào đỉnh hoặc cạnh để xem số lượng.'}</p>
          </div>
        `, 'Hình học không gian'));
        app.querySelector('#xoay-trai').addEventListener('click', () => { angle -= 18; redraw(); });
        app.querySelector('#xoay-phai').addEventListener('click', () => { angle += 18; redraw(); });
        app.querySelector('#dem-dinh').addEventListener('click', () => { mode = 'dinh'; redraw(); });
        app.querySelector('#dem-canh').addEventListener('click', () => { mode = 'canh'; redraw(); });
      }
      redraw();
    }

    function renderMagnet() {
      let touched = '';
      setHTML(shell('Thực nghiệm ảo về nam châm', 'Kéo nam châm lại gần vật thể để quan sát vật nào bị hút và vật nào không bị hút.', `
        <div class="grid">
          <div class="scene" style="padding:18px;display:grid;gap:12px;background:linear-gradient(180deg,#f2f8ff,#fffef9);">
            <div class="tool-row">
              <button class="piece" data-item="dinh">Đinh sắt</button>
              <button class="piece" data-item="go">Cục gỗ</button>
              <button class="piece" data-item="ghim">Ghim giấy</button>
            </div>
            <div class="center-panel" style="min-height:140px;">
              <div>
                <div style="font-size:72px;">🧲</div>
                <p class="hint">Bấm vào một vật để kéo nam châm lại gần vật đó.</p>

    function renderStepMath() {
      let selectedOperation = '';
      let answer = '';
      let checked = false;
      const left = getPositiveIntParam('left', 3);
      const right = getPositiveIntParam('right', 4);
      const rawOperation = params.get('operation') || 'x';
      const correctOperation = ['+', '-', 'x', ':'].includes(rawOperation) ? rawOperation : 'x';
      const groupLabel = escapeHtml(getSafeLabelParam('groupLabel', 'tui'));
      const itemLabel = escapeHtml(getSafeLabelParam('itemLabel', 'vien keo'));
      const correctAnswerValue = correctOperation === '+'
        ? left + right
        : correctOperation === '-'
        ? left - right
        : correctOperation === ':'
        ? Math.floor(left / right)
        : left * right;
      const correctAnswer = String(correctAnswerValue);
      const operationText = correctOperation === 'x' ? 'nhan' : correctOperation === ':' ? 'chia' : correctOperation === '+' ? 'cong' : 'tru';
      const problemText = correctOperation === '+'
        ? `C&oacute; <mark style="background:#fff3b5;padding:0 6px;border-radius:8px;">${left} ${itemLabel}</mark>, th&ecirc;m <mark style="background:#daf4ed;padding:0 6px;border-radius:8px;">${right} ${itemLabel}</mark>. H&#7887;i c&oacute; t&#7845;t c&#7843; bao nhi&ecirc;u ${itemLabel}?`
        : correctOperation === '-'
        ? `C&oacute; <mark style="background:#fff3b5;padding:0 6px;border-radius:8px;">${left} ${itemLabel}</mark>, b&#7899;t &#273;i <mark style="background:#daf4ed;padding:0 6px;border-radius:8px;">${right} ${itemLabel}</mark>. C&ograve;n l&#7841;i bao nhi&ecirc;u ${itemLabel}?`
        : correctOperation === ':'
        ? `C&oacute; <mark style="background:#fff3b5;padding:0 6px;border-radius:8px;">${left} ${itemLabel}</mark> chia &#273;&#7873;u v&agrave;o <mark style="background:#daf4ed;padding:0 6px;border-radius:8px;">${right} ${groupLabel}</mark>. M&#7895;i ${groupLabel} c&oacute; bao nhi&ecirc;u ${itemLabel}?`
        : `C&oacute; <mark style="background:#fff3b5;padding:0 6px;border-radius:8px;">${left} ${groupLabel}</mark>, m&#7895;i ${groupLabel} c&oacute; <mark style="background:#daf4ed;padding:0 6px;border-radius:8px;">${right} ${itemLabel}</mark>. H&#7887;i c&oacute; t&#7845;t c&#7843; bao nhi&ecirc;u ${itemLabel}?`;
      function redraw() {
        const isOperationCorrect = selectedOperation === correctOperation;
        const isAnswerCorrect = answer.trim() === correctAnswer;
        const isDone = checked && isOperationCorrect && isAnswerCorrect;
        setHTML(shell('Bài toán Step-by-step', 'Hiện đề bài có tô màu từ khóa. Em chọn phép tính phù hợp rồi điền kết quả vào ô trống.', `
          <div class="grid">
            <div class="config-card" style="border:1px solid var(--line);border-radius:20px;padding:16px;background:#fff;">
              <p class="sub">Đề bài mẫu</p>
              <h2 style="margin-top:6px;">Có <mark style="background:#fff3b5;padding:0 6px;border-radius:8px;">3 túi kẹo</mark>, mỗi túi có <mark style="background:#daf4ed;padding:0 6px;border-radius:8px;">4 viên</mark>. Có tất cả bao nhiêu viên kẹo?</h2>
            </div>
            <div class="tool-row">
              <button class="tool ${selectedOperation === '+' ? 'tool-active' : ''}" data-op="+">+</button>
              <button class="tool ${selectedOperation === '-' ? 'tool-active' : ''}" data-op="-">-</button>
              <button class="tool ${selectedOperation === 'x' ? 'tool-active' : ''}" data-op="x">x</button>
              <button class="tool ${selectedOperation === ':' ? 'tool-active' : ''}" data-op=":">:</button>
            </div>
            <label>
              <span class="slot-label">Điền số vào ô trả lời</span>
              <input id="math-answer" type="text" inputmode="numeric" value="${answer}" placeholder="Ví dụ: 12" />
            </label>
            <div class="tool-row">
              <button class="tool" id="math-check">Kiểm tra đáp án</button>
            </div>
            <p class="${isDone ? 'success' : checked ? 'warn' : 'hint'}">
              ${isDone ? 'Đúng rồi. 3 túi, mỗi túi 4 viên nên cần phép nhân và kết quả là 12.' : checked ? 'Thử lại nhé. Gợi ý: nhiều nhóm giống nhau thì chọn phép nhân.' : 'Bước 1: đọc từ khóa. Bước 2: chọn phép tính. Bước 3: điền kết quả.'}
            </p>
          </div>
        `, 'Giảm tải tư duy'));
        const dynamicProblemNode = app.querySelector('.config-card h2');
        if (dynamicProblemNode) dynamicProblemNode.innerHTML = problemText;
        const dynamicFeedbackNode = app.querySelector('.grid > p.success, .grid > p.warn, .grid > p.hint');
        if (dynamicFeedbackNode) {
          dynamicFeedbackNode.innerHTML = isDone
            ? `&#272;&uacute;ng r&#7891;i. Ph&eacute;p t&iacute;nh l&agrave; ${left} ${correctOperation} ${right} = ${correctAnswer}.`
            : checked
            ? `Th&#7917; l&#7841;i nh&eacute;. G&#7907;i &yacute;: b&agrave;i n&agrave;y c&#7847;n ph&eacute;p ${operationText}.`
            : 'B&#432;&#7899;c 1: &#273;&#7885;c t&#7915; kh&oacute;a. B&#432;&#7899;c 2: ch&#7885;n ph&eacute;p t&iacute;nh. B&#432;&#7899;c 3: &#273;i&#7873;n k&#7871;t qu&#7843;.';
        }
        app.querySelectorAll('[data-op]').forEach((node) => {
          node.addEventListener('click', () => {
            selectedOperation = node.getAttribute('data-op');
            checked = false;
            redraw();
          });
        });
        app.querySelector('#math-answer').addEventListener('input', (event) => {
          answer = event.target.value;
          checked = false;
        });
        app.querySelector('#math-check').addEventListener('click', () => {
          checked = true;
          redraw();
        });
      }
      redraw();
    }

    function renderAnimalGrouping() {
      let selected = '';
      const state = {
        giaSuc: [],
        giaCam: [],
      };
      const animals = [
        { id: 'bo', label: 'Bò', target: 'giaSuc' },
        { id: 'heo', label: 'Heo', target: 'giaSuc' },
        { id: 'ga', label: 'Gà', target: 'giaCam' },
        { id: 'vit', label: 'Vịt', target: 'giaCam' },
      ];

      function redraw() {
        const available = animals.filter((animal) => !state.giaSuc.includes(animal.id) && !state.giaCam.includes(animal.id));
        const correctCount = state.giaSuc.filter((id) => animals.find((animal) => animal.id === id)?.target === 'giaSuc').length
          + state.giaCam.filter((id) => animals.find((animal) => animal.id === id)?.target === 'giaCam').length;
        const done = correctCount === animals.length;

        setHTML(shell('Phân loại vật nuôi', 'Kéo hoặc chạm Bò, Heo vào ô Gia súc; Gà, Vịt vào ô Gia cầm.', `

              ${available.map((animal) => `
                <button class="choice ${selected === animal.id ? 'choice-active' : ''}" data-animal="${animal.id}">
                  <strong>${animal.label}</strong>
                  <div class="hint">Chạm để chọn rồi chạm vào nhóm phù hợp.</div>
                </button>
              `).join('')}
            </div>
            <div class="slots">
              <button class="slot ${selected ? 'slot-active' : ''}" data-group="giaSuc">
                <span class="slot-label">Gia súc</span>
                ${state.giaSuc.length ? state.giaSuc.map((id) => `<span class="slot-value">${animals.find((animal) => animal.id === id).label}</span>`).join('') : '<span class="hint">Bò, Heo vào đây</span>'}
              </button>
              <button class="slot ${selected ? 'slot-active' : ''}" data-group="giaCam">
                <span class="slot-label">Gia cầm</span>
                ${state.giaCam.length ? state.giaCam.map((id) => `<span class="slot-value">${animals.find((animal) => animal.id === id).label}</span>`).join('') : '<span class="hint">Gà, Vịt vào đây</span>'}
              </button>
            </div>
            <p class="${done ? 'success' : 'hint'}">${done ? 'Đúng rồi. Bò, Heo là gia súc; Gà, Vịt là gia cầm.' : `Đã xếp đúng ${correctCount}/${animals.length} con vật.`}</p>
          </div>
        `, 'Công nghệ nông nghiệp'));

        app.querySelectorAll('[data-animal]').forEach((node) => {
          node.addEventListener('click', () => {
            selected = node.getAttribute('data-animal');
            redraw();
          });
        });

        app.querySelectorAll('[data-group]').forEach((node) => {
          node.addEventListener('click', () => {
            if (!selected) return;
            state.giaSuc = state.giaSuc.filter((item) => item !== selected);
            state.giaCam = state.giaCam.filter((item) => item !== selected);
            state[node.getAttribute('data-group')].push(selected);
            selected = '';
            redraw();
          });
        });
      }

      redraw();
    }

    function renderBullyingVideo() {
      let playing = false;
      let percent = 0;
      let timer = null;

      function stopTimer() {
        if (timer) {
          window.clearInterval(timer);
          timer = null;
        }
      }

      function redraw() {
        setHTML(shell('Video tình huống (A/B)', 'Xem clip 5 giây bạn bị bắt nạt. Khi clip dừng, em chọn A hoặc B ở hoạt động chính.', `

              <div class="bar-track"><div class="bar-fill" style="width:${percent}%"></div></div>
              <span>${percent < 100 ? 'Quan sát tình huống rồi chuẩn bị chọn A: Báo cô giáo hoặc B: Đứng xem.' : 'Bây giờ hãy chọn cách xử lí đúng ở bên dưới.'}</span>
            </div>
          </div>
          <div class="tool-row">
            <button class="tool" id="play-bullying">${playing ? 'Đang chạy' : percent >= 100 ? 'Xem lại clip' : 'Bắt đầu clip'}</button>
          </div>
          <p class="${percent >= 100 ? 'success' : 'hint'}">${percent >= 100 ? 'Đáp án đúng là A. Báo cô giáo.' : 'Clip này mô phỏng đúng bước 1 trong bosung.md trước khi em chọn A/B.'}</p>
        `, 'Ứng xử đúng đắn'));

        app.querySelector('#play-bullying').addEventListener('click', () => {
          if (playing) return;
          playing = true;
          percent = 0;
          redraw();
          stopTimer();
          timer = window.setInterval(() => {
            percent += 20;
            if (percent >= 100) {
              percent = 100;
              playing = false;
              stopTimer();
            }
            redraw();
          }, 1000);
        });
      }

      redraw();
    }

              <div class="flower" style="left:120px;bottom:34px;"></div>
              <div class="flower" style="right:30px;bottom:42px;"></div>
              ${stickers.map((item, index) => `<span class="sticker" style="left:${24 + (index * 74) % 240}px;top:${28 + (index % 2) * 88}px;">${item}</span>`).join('')}
            </div>
            <p class="${stickers.length >= 2 ? 'success' : 'hint'}">${stickers.length >= 2 ? 'Bố cục thiệp đã bắt đầu cân đối hơn rồi.' : 'Bấm sticker để thêm vào bức tranh Vườn hoa.'}</p>
          </div>
        `, 'Sáng tạo bố cục'));
        app.querySelectorAll('[data-sticker]').forEach((node) => node.addEventListener('click', () => { stickers.push(node.getAttribute('data-sticker')); redraw(); }));
      }
      redraw();
    }

    function renderFlashcards() {
      const open = { vanmieu: false, gom: false };
      function redraw() {
        setHTML(shell('Flashcard lật mở', 'Hiện hình Văn miếu Trấn Biên và Gốm Biên Hòa. Chạm để lật xem thông tin ngắn gọn.', `
          <div class="flip-grid">
            <button class="flip-card" data-flip="vanmieu">
              <img src="photos/van-mieu-tran-bien.jpg" alt="Văn miếu Trấn Biên" />
              <div class="flip-copy">
                <strong>Văn miếu Trấn Biên</strong>
                <p class="sub">${open.vanmieu ? 'Di tích văn hóa nổi tiếng của Đồng Nai, gắn với truyền thống hiếu học.' : 'Chạm để lật xem thông tin.'}</p>
              </div>
            </button>
            <button class="flip-card" data-flip="gom">
              <img src="photos/gom-bien-hoa.jpg" alt="Gốm Biên Hòa" />
              <div class="flip-copy">
                <strong>Gốm Biên Hòa</strong>
                <p class="sub">${open.gom ? 'Làng nghề gốm lâu đời, nổi bật với hoa văn thủ công và men nâu.' : 'Chạm để lật xem thông tin.'}</p>
              </div>
            </button>
          </div>
        `, 'Quê hương Đồng Nai'));
        app.querySelectorAll('[data-flip]').forEach((node) => node.addEventListener('click', () => { open[node.getAttribute('data-flip')] = !open[node.getAttribute('data-flip')]; redraw(); }));
      }
      redraw();
    }

    function renderDongNaiVideo() {
      let playing = false;
      let percent = 0;
      let timer = null;
      function stopTimer() {
        if (timer) {
          window.clearInterval(timer);
          timer = null;
        }
      }
      function redraw() {
        setHTML(shell('Video tương tác về Đồng Nai', 'Xem clip ngắn. App tự động dừng lại và hỏi “Đây là gì?”.', `
          <div class="video-frame">
            <img src="photos/van-mieu-tran-bien.jpg" alt="Khung hình Văn miếu Trấn Biên" />
            <div class="video-bar">
              <strong>Khung cảnh Văn miếu Trấn Biên</strong>
              <div class="bar-track"><div class="bar-fill" style="width:${percent}%"></div></div>
              <span>${percent < 100 ? 'Clip đang chạy chậm để em quan sát.' : 'Clip đã dừng lại. Hãy trả lời ở ngoài hoạt động chính của app.'}</span>
            </div>
          </div>
          <div class="tool-row">
            <button class="tool" id="play-video">${playing ? 'Đang chạy' : percent >= 100 ? 'Xem lại clip' : 'Bắt đầu clip'}</button>
          </div>
          <p class="${percent >= 100 ? 'success' : 'hint'}">${percent >= 100 ? 'Gợi ý đáp án: Văn miếu Trấn Biên.' : 'Khi clip dừng, em sẽ thấy câu hỏi ở hoạt động chính.'}</p>
        `, 'Kiến trúc địa phương'));
        app.querySelector('#play-video').addEventListener('click', () => {
          if (playing) return;
          playing = true;
          percent = 0;
          redraw();
          stopTimer();
          timer = window.setInterval(() => {
            percent += 10;
            if (percent >= 100) {
              percent = 100;
              playing = false;
              stopTimer();
            }
            redraw();
          }, 1000);
        });
      }
      redraw();
    }

    function renderArBurst() {
      let score = 0;
      let count = 0;
      function bubbleMarkup(id, left, top) {
        return `<button class="bubble" data-bubble="${id}" style="left:${left}px;top:${top}px;">◎</button>`;
      }
      function redraw() {
        const bubbles = [bubbleMarkup(1, 26, 34), bubbleMarkup(2, 162, 72), bubbleMarkup(3, 250, 144), bubbleMarkup(4, 104, 184)].slice(0, Math.max(4 - score, 0)).join('');
        setHTML(shell('AR Camera - Tập theo nhạc', 'Màn hình hiện vòng tròn ảo. Em vung tay hoặc chạm để làm vỡ các vòng tròn theo nhịp.', `
          <div class="burst-stage">
            ${bubbles}
          </div>
          <p class="${score >= 4 ? 'success' : 'hint'}">${score >= 4 ? 'Em đã làm vỡ hết vòng tròn ảo rồi.' : `Đã làm vỡ ${score}/4 vòng tròn.`}</p>
        `, 'Vận động thô'));
        app.querySelectorAll('[data-bubble]').forEach((node) => node.addEventListener('click', () => { score += 1; count += 1; redraw(); }));
      }
      redraw();
    }

    function renderRhythmTap() {
      let noteTop = 18;
      let running = false;
      let done = false;
      let timer = null;
      function stopTimer() {
        if (timer) window.clearInterval(timer);
        timer = null;
      }
      function redraw() {
        setHTML(shell('Đệm hát ảo', 'Nhạc phát, các nốt sáng chạy xuống. Chạm đúng lúc nốt chạm mặt trống để gõ phách.', `
          <div class="rhythm-stage">
            <div class="note" id="note" style="top:${noteTop}px;">♪</div>
            <button class="drum" id="drum">🥁</button>
          </div>
          <div class="tool-row">
            <button class="tool" id="start-rhythm">${running ? 'Đang chạy' : done ? 'Chơi lại' : 'Bắt đầu'}</button>
          </div>
          <p class="${done ? 'success' : 'hint'}">${done ? 'Đúng nhịp rồi, em đã gõ phách đúng lúc.' : 'Bắt đầu rồi chạm vào trống khi nốt nhạc chạm xuống gần đáy.'}</p>
        `, 'Nhịp điệu'));
        app.querySelector('#start-rhythm').addEventListener('click', () => {
          if (running) return;
          running = true;
          done = false;
          noteTop = 18;
          redraw();
          stopTimer();
          timer = window.setInterval(() => {
            noteTop += 18;
            if (noteTop >= 188) {
              noteTop = 188;
              running = false;
              stopTimer();
            }
            redraw();
          }, 180);
        });
        app.querySelector('#drum').addEventListener('click', () => {
          if (noteTop >= 170 && noteTop <= 202) {
            done = true;
            running = false;
            stopTimer();
            redraw();
          }
        });
      }
      redraw();
    }
